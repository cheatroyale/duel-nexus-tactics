name: Godot script check

# Imports the project with a headless Godot and fails when any script reports a
# parse error. This is the only way to have the GDScript checked from here: the
# log names the exact file and line.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project
        run: |
          set -uo pipefail
          ./godot --headless --path . --import > import.log 2>&1 || true
          echo "=== root errors (not DB cascade) ==="
          grep -A1 'Parse Error' import.log | grep -v 'Could not resolve' | head -14 || true
          echo "=== cascade count ==="
          grep -c 'Parse Error' import.log || true
          echo "=== end of errors ==="
          if grep -Eiq 'parse error|failed to load script|script error' import.log; then
            echo "::error::Godot reported script errors; see the list above"
            exit 1
          fi

      - name: Boot the game for a few frames
        run: |
          set -uo pipefail
          ./godot --headless --path . --quit-after 3 > run.log 2>&1 || true
          echo "=== runtime errors ==="
          grep -E 'SCRIPT ERROR|ERROR:' run.log | head -20 || true
          echo "=== end of runtime errors ==="
          if grep -q 'SCRIPT ERROR' run.log; then
            echo "::error::The game reported script errors while booting"
            exit 1
          fi


